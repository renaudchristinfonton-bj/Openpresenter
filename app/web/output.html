<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPresenter — Sortie</title>
<style>
  :root{
    --bg:#000; --fg:#fff; --accent:#f5b942;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
  body{font-family:var(--font);color:var(--fg)}

  /* La scène fait 1920×1080 et est mise à l'échelle de l'écran.
     Aucun style de contenu ici : tout vient de `SCENE_CSS` (ENF-42). */
  #stage{
    position:absolute; left:50%; top:50%;
    transform-origin:center center;
    overflow:hidden;
  }

  /* État hors ligne / en attente. */
  #wait{
    position:fixed; inset:0; display:none; z-index:5;
    align-items:center; justify-content:center; flex-direction:column; gap:14px;
    background:#05060a; color:#8b93a5; font-size:22px; text-align:center; padding:40px;
  }
  #wait.show{display:flex}
  #wait b{color:#e8eaf0; font-size:30px; font-weight:800; letter-spacing:-.01em}
  .dot{width:10px;height:10px;border-radius:50%;background:#ef5360;display:inline-block}
  .dot.on{background:#34d399}

  /* Mode debug : informations de contrôle, jamais visibles à l'antenne. */
  #debug{
    position:fixed; left:14px; top:14px; z-index:10;
    font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.5;
    color:#0f0; background:rgba(0,0,0,.72); padding:10px 12px; border-radius:8px;
    border:1px solid #0f03; display:none; white-space:pre;
  }
  body.debug #debug{display:block}
  .progress{
    position:fixed; left:0; right:0; bottom:0; height:3px; background:#ffffff12; z-index:6;
  }
  .progress i{display:block; height:100%; background:var(--accent); width:0; transition:width .18s}
  body.hide-progress .progress{display:none}
</style>
</head>
<body>
<div id="stage" aria-live="polite" aria-atomic="true"></div>

<div id="wait">
  <div><span class="dot" id="dot"></span> <span id="waitText">Connexion à OpenPresenter…</span></div>
  <div id="waitHint"></div>
</div>

<div id="debug"></div>
<div class="progress"><i id="bar"></i></div>

<script type="module">
// Un seul moteur de rendu pour l'éditeur et la sortie (A-10 / ENF-42).
import { mountScene, applyAutoFit, SCENE_CSS, STAGE_WIDTH, STAGE_HEIGHT } from '/shared/render/engine.mjs';
import { contentFromPayload } from '/shared/render/content.mjs';
import { fallbackSceneFor } from '/shared/scene.mjs';

(() => {
  const params = new URLSearchParams(location.search);
  const outputId = location.pathname.split('/')[2] || params.get('output') || 'out_full';
  const queryKind = params.get('kind') || null;
  const debug = params.get('debug') === '1';
  const token = params.get('t') || '';
  if (debug) document.body.classList.add('debug');

  const $ = (s) => document.querySelector(s);
  const stage = $('#stage');
  const bar = $('#bar');
  const wait = $('#wait');
  const dot = $('#dot');

  // Feuille de style de la scène : identique à celle de l'éditeur, servie par
  // le même module, donc aucune divergence de rendu possible.
  const styleEl = document.createElement('style');
  styleEl.id = 'op-scene-css';
  styleEl.textContent = SCENE_CSS;
  document.head.append(styleEl);
  // Résolution de l'URL pour les assets locaux (`?t=` porte le jeton réseau).
  const withToken = (url) => (token ? `${url}${url.includes('?') ? '&' : '?'}t=${encodeURIComponent(token)}` : url);

  let output = null;
  let current = null;     // dernier message `show`
  let currentKind = null;
  let scenes = new Map(); // kind → scène
  let socket = null;
  let retry = 0;
  let connected = false;

  // ---------------------------------------------------------------------
  // Mise à l'échelle de la scène
  // ---------------------------------------------------------------------
  function fitStage() {
    const w = output?.width || STAGE_WIDTH;
    const h = output?.height || STAGE_HEIGHT;
    const ratio = w / STAGE_WIDTH;
    const scene = stage.querySelector('.op-scene');
    if (scene) {
      // Le canevas reste 1920×1080 et la scène entière est réduite : les
      // proportions ne dépendent jamais de la taille de la fenêtre.
      scene.style.transform = `scale(${ratio})`;
      scene.style.transformOrigin = 'top left';
    }
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    const scale = Math.min(window.innerWidth / w, window.innerHeight / h);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);

  // ---------------------------------------------------------------------
  // Scènes : une par type de contenu, chargée depuis le disque
  // ---------------------------------------------------------------------
  async function loadScene(kind) {
    if (scenes.has(kind)) return scenes.get(kind);
    const sceneId = output?.scenesByKind?.[kind] || null;
    let scene = null;
    if (sceneId) {
      try {
        const res = await fetch(withToken(`/api/scenes/${sceneId}`), { cache: 'no-store' });
        if (res.ok) scene = await res.json();
      } catch { /* repli ci-dessous */ }
    }
    if (!scene) {
      // Aucune scène définie : on retombe sur le preset de la sortie plutôt que
      // d'afficher un écran noir (le culte ne s'arrête pas pour un fichier).
      scene = fallbackSceneFor({
        id: `scn_fallback_${kind}`,
        name: `Repli — ${kind}`,
        kind,
        preset: output?.preset || 'full',
        transparent: Boolean(output?.transparent)
      });
      if (debug) console.warn(`[sortie] scène absente pour « ${kind} », preset « ${output?.preset} » utilisé`);
    }
    scenes.set(kind, scene);
    return scene;
  }

  function assetsFor(scene, content) {
    // Les calques ne connaissent que des identifiants : l'URL est construite ici.
    const map = {};
    const walk = (layers) => {
      for (const layer of layers || []) {
        const id = layer.assetId || layer.source?.assetId;
        if (id) map[id] = withToken(`/api/assets/${id}`);
        if (layer.children) walk(layer.children);
      }
    };
    walk(scene?.layers);
    // Le média diffusé (module Médias) n'appartient pas à la scène : son URL est
    // construite avec le même jeton, jamais devinée par le navigateur.
    if (content?.assetId) map[content.assetId] = withToken(`/api/assets/${content.assetId}`);
    return map;
  }

  // ---------------------------------------------------------------------
  // Minuteur (EF-18) : la sortie calcule elle-même le temps restant
  // ---------------------------------------------------------------------
  function timerRemainingMs(payload = {}) {
    if (payload.mode === 'down' && payload.endsAt) {
      return new Date(payload.endsAt).getTime() - Date.now();
    }
    if (payload.mode === 'up' && payload.startedAt) {
      return (Number(payload.remainingMs) || 0) + (Date.now() - new Date(payload.startedAt).getTime());
    }
    return Number(payload.remainingMs) || 0;
  }

  function timerText(payload = {}) {
    const pad = (value) => String(value).padStart(2, '0');
    let ms;
    if (payload.mode === 'down' && payload.endsAt) {
      ms = new Date(payload.endsAt).getTime() - Date.now();
    } else if (Number.isFinite(Number(payload.remainingMs))) {
      ms = Number(payload.remainingMs);
    } else {
      return payload.timer || '';
    }
    if (payload.mode === 'up' && payload.startedAt) {
      ms = Date.now() - new Date(payload.startedAt).getTime();
    }
    const total = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  // ---------------------------------------------------------------------
  // Rendu
  // ---------------------------------------------------------------------
  async function render(message) {
    current = message;
    if (!message || message.t === 'clear') {
      stage.replaceChildren();
      bar.style.width = '0';
      return;
    }
    const kind = message.kind || 'bible';
    currentKind = kind;
    const scene = await loadScene(kind);
    const content = contentFromPayload(message.payload || {}, kind);
    if (kind === 'timer') {
      const payload = message.payload || {};
      const left = timerRemainingMs(payload);
      content.timer = timerText(left);
      // Seuils : blanc → orange → rouge, calculés ici et non envoyés seconde
      // par seconde (EF-18.3, EF-18.9).
      const warn = Number(payload.warnAtMs);
      const critical = Number(payload.criticalAtMs);
      const down = payload.mode !== 'up';
      if (down && Number.isFinite(critical) && critical >= 0 && left <= critical) {
        content.accent = '#ef5360';
        content.blink = true;
      } else if (down && Number.isFinite(warn) && warn >= 0 && left <= warn) {
        content.accent = '#f5b942';
      }
    }
    const transparent = output?.transparent ?? false;

    // `mountScene` insère **et** ajuste : c'est exactement ce que fait l'éditeur.
    const result = mountScene(stage, {
      scene,
      content,
      assets: assetsFor(scene, content),
      transparent,
      editing: false
    });
    // Une seconde passe après chargement des polices : la mesure dépend d'elles.
    document.fonts?.ready.then(() => applyAutoFit(stage)).catch(() => {});
    fitStage();
    if (debug) console.debug('[sortie] rendu', { layers: scene.layers?.length, html: result.html.length });

    const total = content.partCount || 1;
    const index = (content.partIndex || 0) + 1;
    bar.style.width = total > 1 ? `${Math.round((index / total) * 100)}%` : '0';
    if (debug) logDebug(message);
  }

  // Une seule horloge pour toutes les sorties : on ne redessine que si le
  // texte affiché change (aucun clignotement, aucun trafic réseau).
  let lastTimerText = '';
  setInterval(() => {
    if (!current || current.kind !== 'timer') return;
    const payload = current.payload || {};
    if (!payload.endsAt && payload.mode !== 'up') return;
    const next = `${timerText(payload)}|${timerRemainingMs(payload) <= 0 ? 'x' : ''}`;
    if (next === lastTimerText) return;
    lastTimerText = next;
    render(current);
  }, 500);

  function logDebug(message) {
    const el = $('#debug');
    el.textContent = [
      `sortie   : ${outputId}`,
      `type     : ${message?.kind || '—'}`,
      `filtre   : ${queryKind || 'tout'}`,
      `scène    : ${scenes.get(message?.kind)?.id || '—'}`,
      `établie  : ${connected ? 'oui' : 'non'}`,
      `seq      : ${message?.seq ?? '—'}`,
      `partie   : ${(message?.payload?.partIndex ?? 0) + 1}/${message?.payload?.partCount ?? 1}`,
      `auto-fit : ${stage.querySelectorAll('[data-fit-factor]').length}`,
      `reçu     : ${message?.ts ? new Date(message.ts).toLocaleTimeString('fr-FR') : '—'}`
    ].join('\n');
  }

  // ---------------------------------------------------------------------
  // Chargement de la configuration de la sortie
  // ---------------------------------------------------------------------
  async function loadOutput() {
    try {
      const res = await fetch(withToken('/api/outputs'), { cache: 'no-store' });
      if (!res.ok) throw new Error('configuration illisible');
      const data = await res.json();
      output = (data.outputs || []).find((o) => o.id === outputId) || null;
    } catch {
      output = null;
    }

    if (!output) {
      showWait(
        'Cette sortie n’existe pas',
        `Identifiant « ${outputId} ». Ouvrez le studio pour copier un lien valide.`,
        false
      );
      document.title = 'Sortie introuvable — OpenPresenter';
      return false;
    }

    document.title = `${output.name} — OpenPresenter`;
    if (output.transparent) {
      // Fond alpha : OBS/vMix composent sur la scène, pas sur du noir.
      document.documentElement.style.background = 'transparent';
      document.body.style.background = 'transparent';
    }
    fitStage();

    // Filtre `receives` : un type exclu reste vide même via l'URL directe (EF-08).
    if (queryKind && output.receives && output.receives[queryKind] === false) {
      showWait(
        'Cette sortie ne reçoit pas ce type de contenu',
        `« ${output.name} » n’accepte pas les contenus de type « ${queryKind} ».`,
        true
      );
      return false;
    }
    hideWait();
    return true;
  }

  function showWait(title, hint, keepOnline) {
    wait.classList.add('show');
    $('#waitText').textContent = title;
    $('#waitHint').textContent = hint || '';
    dot.classList.toggle('on', Boolean(keepOnline));
  }

  function hideWait() {
    wait.classList.remove('show');
  }

  // ---------------------------------------------------------------------
  // WebSocket
  // ---------------------------------------------------------------------
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/ws?channel=op_out_${outputId}${token ? `&t=${encodeURIComponent(token)}` : ''}`;
    socket = new WebSocket(url);

    socket.addEventListener('open', () => {
      connected = true;
      retry = 0;
      socket.send(JSON.stringify({ t: 'hello' }));
      hideWait();
      if (debug) logDebug(current);
      // Resynchronise l'antenne : une page rouverte doit retrouver l'affichage.
      fetch(withToken('/api/live/state'), { cache: 'no-store' })
        .then((r) => (r.ok ? r.json() : null))
        .then((state) => {
          const shown = state?.channels?.[outputId];
          if (shown && shown.t === 'show') render(shown);
        })
        .catch(() => {});
    });

    socket.addEventListener('message', (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      if (msg.t === 'show') {
        // Une sortie filtrée ignore silencieusement les autres types.
        if (queryKind && output?.receives && output.receives[queryKind] === false) return;
        render(msg);
      } else if (msg.t === 'clear') {
        render({ t: 'clear' });
      } else if (msg.t === 'project:changed' && String(msg.resource || '').startsWith('scenes/')) {
        // Une scène corrigée dans le studio doit s'appliquer sans recharger.
        scenes.clear();
        if (current?.t === 'show') render(current);
      } else if (msg.t === 'error') {
        showWait('Message invalide', msg.message || '', true);
      }
    });

    socket.addEventListener('close', () => {
      connected = false;
      if (document.hidden) return;
      const delay = Math.min(1000 * 2 ** retry++, 8000);
      showWait('Connexion perdue', `Nouvelle tentative dans ${Math.round(delay / 1000)} s.`, false);
      setTimeout(connect, delay);
    });

    socket.addEventListener('error', () => socket.close());
  }

  // Une sortie ne doit jamais s'endormir pendant un culte.
  setInterval(() => {
    if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ t: 'ping' }));
  }, 25000);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && socket?.readyState !== WebSocket.OPEN) connect();
  });

  // Raccourcis de secours sur la sortie elle-même (si le poste est seul).
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') render({ t: 'clear' });
  });

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  (async () => {
    const ok = await loadOutput();
    if (!ok) return;
    connect();
  })();
})();
</script>
</body>
</html>
