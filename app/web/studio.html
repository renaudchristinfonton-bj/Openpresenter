<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPresenter — Studio</title>
<style>
  :root{
    --bg:#0b0d12; --bg2:#11141c; --bg3:#171b25; --line:#252a36; --line2:#333a4a;
    --txt:#e8eaf0; --txt2:#9aa3b5; --txt3:#6b7487; --accent:#f5b942;
    --ok:#34d399; --warn:#f59e0b; --err:#ef5360;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px}
  body{display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#07080d;flex:0 0 auto}
  .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#ed7958);display:grid;place-items:center;color:#17110a;font-size:10px;font-weight:900}
  h1{font-size:13px;margin:0;font-weight:800;letter-spacing:.02em}
  .who{font-size:11px;color:var(--txt3)}
  .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid var(--line2);background:var(--bg3);color:var(--txt2)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--err)}
  .chip.on .dot{background:var(--ok)}
  a.chip{text-decoration:none}
  a.chip:hover{background:#1e2331;color:var(--txt)}

  main{flex:1;display:grid;grid-template-columns:minmax(340px,420px) 1fr;min-height:0}
  @media (max-width:900px){ main{grid-template-columns:1fr} }

  .panel{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
  .panel h2{margin:0;padding:8px 12px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);border-bottom:1px solid var(--line);background:#07080d}

  /* Champ de saisie unique (ch. 09 § 9.3.1) */
  .field-wrap{padding:12px}
  .field{
    display:flex;align-items:center;gap:8px;
    padding:12px 14px;border-radius:9px;
    background:#05060a;border:2px solid var(--line2);
    font-family:var(--mono);font-size:19px;letter-spacing:.01em;
    cursor:text;min-height:54px;
  }
  .field:focus-within,.field.active{border-color:var(--accent);box-shadow:0 0 0 3px #f5b9421f}
  .field .prefix{
    display:inline-flex;align-items:center;gap:6px;
    padding:2px 8px;border-radius:5px;background:#f5b9421a;color:var(--accent);
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .field .prefix:hover{background:#f5b9422e}
  .field .typed{color:var(--txt);white-space:pre}
  .field .ghost{color:var(--txt3);font-size:13px;font-family:var(--sans)}
  .caret{width:2px;height:22px;background:var(--accent);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .hint{font-size:11px;color:var(--txt3);margin-top:7px;line-height:1.5}
  .hint kbd{font-family:var(--mono);background:var(--bg3);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--txt2)}
  .msg{margin-top:8px;padding:8px 10px;border-radius:7px;font-size:11.5px;line-height:1.45;display:none}
  .msg.show{display:block}
  .msg.error{background:#ef53601a;border:1px solid #ef536044;color:#ff8f98}
  .msg.warning{background:#f59e0b1a;border:1px solid #f59e0b44;color:#ffce7a}

  /* Suggestions de livres */
  .suggest{border-top:1px solid var(--line);max-height:230px;overflow:auto}
  .suggest:empty{display:none}
  .sug{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-size:13px;border-left:2px solid transparent}
  .sug .abbr{font-family:var(--mono);font-size:11px;color:var(--txt3);width:34px}
  .sug .n{flex:1}
  .sug .ch{font-size:10px;color:var(--txt3)}
  .sug.hi{background:#f5b94214;border-left-color:var(--accent)}
  .sug.hi .n{color:var(--accent);font-weight:700}

  /* Parties */
  .parts{flex:1;overflow:auto;min-height:0}
  .part{padding:9px 12px;border-bottom:1px solid #1a1e28;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .part:hover{background:#ffffff06}
  .part.cur{background:#f5b94212;box-shadow:inset 2px 0 0 var(--accent)}
  .part .idx{font-family:var(--mono);font-size:10px;color:var(--txt3);padding-top:2px;min-width:16px}
  .part .body{font-size:12.5px;line-height:1.45;color:var(--txt2)}
  .part.cur .body{color:var(--txt)}
  .part .meta{font-family:var(--mono);font-size:9px;color:var(--txt3);margin-top:3px}
  .empty-state{padding:24px 16px;color:var(--txt3);font-size:12px;line-height:1.6;text-align:center}

  /* Scène */
  .stage-wrap{display:flex;flex-direction:column;min-height:0;background:#05060a}
  .stage-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#07080d;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:6px;border:1px solid var(--line2);background:var(--bg3);color:var(--txt);font-size:11.5px;font-weight:650;cursor:pointer;font-family:inherit}
  .btn:hover{background:#1e2331}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#17110a;font-weight:800}
  .btn.danger{color:#ff9aa2;border-color:#ef536055}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:4px 8px;font-size:10.5px}
  .refbar{font-family:var(--mono);font-size:12px;color:var(--accent)}
  .counter{font-family:var(--mono);font-size:11px;color:var(--txt3)}

  .stage{flex:1;min-height:0;display:grid;place-items:center;padding:14px;position:relative}
  .screen{
    position:relative;width:100%;max-width:960px;aspect-ratio:16/9;
    background:#000;border-radius:8px;overflow:hidden;
    box-shadow:0 20px 60px #000a, 0 0 0 1px var(--line);
    display:flex;align-items:center;justify-content:center;
    padding:4% 6%;
  }
  /* Aperçu : la scène est rendue à 1920×1080 puis réduite. Aucun style de
     contenu ici — l'éditeur et la sortie partagent `SCENE_CSS` (ENF-42). */
  .screen{position:relative;overflow:hidden;padding:0}
  .op-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}
  .stage-idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2b3040;font-weight:600;font-size:15px}
  .screen.idle .op-stage{display:none}

  .strip{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:#07080d;overflow:auto;flex:0 0 auto;flex-wrap:wrap}
  .out{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:6px;border:1px solid var(--line2);background:var(--bg2);font-size:11px;cursor:pointer;user-select:none}
  .out input{accent-color:var(--accent);margin:0}
  .out .nm{font-weight:650}
  .out .ty{font-family:var(--mono);font-size:9px;color:var(--txt3)}
  .out.on{border-color:#f5b94266;background:#f5b94210}

  .toast{position:fixed;right:14px;bottom:14px;padding:9px 12px;border-radius:8px;background:#141a24;border:1px solid var(--line2);font-size:12px;opacity:0;transform:translateY(6px);transition:.16s;pointer-events:none;max-width:340px}
  .toast.show{opacity:1;transform:none}
  .toast.err{border-color:#ef536055;background:#1a0f12;color:#ff9aa2}
</style>
</head>
<body>

<header>
  <span class="mark">OP</span>
  <div>
    <h1>Studio</h1>
    <div class="who" id="who">chargement…</div>
  </div>
  <span class="spacer"></span>
  <span class="chip" id="ws"><span class="dot"></span> <span id="wsText">connexion</span></span>
  <a class="chip" href="/scene.html" title="Éditeur de scène (WYSIWYG)">Scène</a>
  <a class="chip" href="/socle.html" title="État du socle et diagnostic">Socle</a>
</header>

<main>
  <section class="panel">
    <h2>Bible — saisie clavier</h2>

    <div class="field-wrap">
      <div class="field active" id="field" tabindex="0" role="combobox" aria-expanded="false" aria-label="Recherche de référence biblique">
        <span class="prefix" id="prefix" hidden>Jean ▸</span>
        <span class="typed" id="typed"></span>
        <span class="caret" id="caret"></span>
        <span class="ghost" id="ghost"></span>
      </div>
      <div class="msg" id="msg"></div>
      <div class="hint">
        <kbd>j</kbd> <kbd>e</kbd> <kbd>Entrée</kbd> <kbd>3</kbd> <kbd>Espace</kbd> <kbd>1</kbd> <kbd>6</kbd> <kbd>Entrée</kbd>
        · <kbd>↑</kbd><kbd>↓</kbd> choisir · <kbd>Échap</kbd> reculer
      </div>
    </div>

    <div class="suggest" id="suggest"></div>

    <h2 style="border-top:1px solid var(--line)">Parties <span class="spacer"></span><span id="partInfo" class="chip" style="border:none;background:none;padding:0;color:var(--txt3)"></span></h2>
    <div class="parts" id="parts">
      <div class="empty-state">
        Saisissez une référence :<br>
        <span class="mono">Jean 3:16</span> · <span class="mono">Ps 23</span> · <span class="mono">1 Corinthiens 13:4-7</span>
      </div>
    </div>
  </section>

  <section class="stage-wrap">
    <div class="stage-bar">
      <span class="refbar" id="refbar">—</span>
      <span class="counter" id="counter"></span>
      <span class="spacer"></span>
      <button class="btn sm" id="prev" title="Élément précédent (←)">◀</button>
      <button class="btn sm" id="next" title="Élément suivant (→)">▶</button>
      <button class="btn primary sm" id="go" title="Diffuser (Entrée)">Diffuser</button>
      <button class="btn danger sm" id="clear" title="Couper (Échap sur la scène)">Couper</button>
    </div>

    <div class="stage">
      <div class="screen idle" id="screen">
        <div class="op-stage" id="stage"></div>
        <div class="stage-idle" id="preview">Aucun contenu à l’antenne</div>
      </div>
    </div>

    <div class="strip" id="outputs"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { createEntry, STATE } from '/shared/bible/reference.mjs';
import { navigate, currentItem, actionForKey, isTypingTarget, positionLabel } from '/shared/bible/navigation.mjs';
// Le même moteur que la page de sortie : l'aperçu est la sortie (A-10).
import { mountScene, SCENE_CSS } from '/shared/render/engine.mjs';
import { contentFromPayload } from '/shared/render/content.mjs';
import { sceneFromPreset } from '/shared/scene.mjs';

{
  const style = document.createElement('style');
  style.id = 'op-scene-css';
  style.textContent = SCENE_CSS;
  document.head.append(style);
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const SETTINGS = { splitMode: 'auto', splitBy: 'words', maxWordsPerScreen: 25, minWordsPerPart: 3, balanceParts: true };

let entry = createEntry({ verseCount: () => null });
let selection = null;
let outputs = [];
let targets = new Set();
let bibleId = null;
let socket = null;

function toast(message, kind = '') {
  const el = $('#toast');
  el.textContent = message;
  el.className = 'toast show ' + kind;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = 'toast ' + kind; }, 3200);
}

// ---------------------------------------------------------------------------
// Affichage du champ
// ---------------------------------------------------------------------------
function paintField() {
  const s = entry.state;
  const prefix = $('#prefix');
  if (s.bookNum) {
    prefix.hidden = false;
    const b = entry.state.suggestions?.[0];
    prefix.textContent = `${entry.label.split(' ▸ ')[0]} ▸`;
  } else {
    prefix.hidden = true;
  }
  const full = entry.label;
  const cut = s.bookNum ? full.indexOf('▸') + 1 : 0;
  $('#typed').textContent = s.bookNum ? full.slice(cut).trimStart() : s.query;
  $('#ghost').textContent = s.mode === STATE.BOOK && !s.query ? 'tapez un livre…' : '';

  const msg = $('#msg');
  if (s.message) {
    msg.textContent = s.message;
    msg.className = 'msg show ' + (s.messageKind === 'error' ? 'error' : 'warning');
  } else {
    msg.className = 'msg';
    msg.textContent = '';
  }
}

function paintSuggestions() {
  const s = entry.state;
  const box = $('#suggest');
  $('#field').setAttribute('aria-expanded', s.mode === STATE.BOOK && s.suggestions.length ? 'true' : 'false');
  if (s.mode !== STATE.BOOK || !s.suggestions.length) { box.innerHTML = ''; return; }
  box.innerHTML = s.suggestions.map((b, i) => `
    <div class="sug ${i === s.highlight ? 'hi' : ''}" data-num="${b.num}">
      <span class="abbr">${esc(b.abbr)}</span>
      <span class="n">${esc(b.name)}</span>
      <span class="ch">${b.chapters} ch.</span>
    </div>`).join('');
  box.querySelectorAll('.sug').forEach((el) => {
    el.addEventListener('click', () => {
      entry.selectBook(Number(el.dataset.num));
      paintAll();
      focusField();
    });
  });
}

function paintParts() {
  const box = $('#parts');
  if (!selection || !selection.items.length) {
    box.innerHTML = `<div class="empty-state">Saisissez une référence :<br>
      <span class="mono">Jean 3:16</span> · <span class="mono">Ps 23</span> ·
      <span class="mono">1 Corinthiens 13:4-7</span></div>`;
    $('#partInfo').textContent = '';
    $('#refbar').textContent = '—';
    $('#counter').textContent = '';
    return;
  }
  const cur = selection.index;
  box.innerHTML = selection.items.map((it, i) => `
    <div class="part ${i === cur ? 'cur' : ''}" data-i="${i}">
      <span class="idx">${i + 1}</span>
      <span class="body">${esc(it.text)}
        <span class="meta">v. ${it.verse} · partie ${it.partIndex + 1}/${it.partCount}</span>
      </span>
    </div>`).join('');
  box.querySelectorAll('.part').forEach((el) => {
    el.addEventListener('click', () => {
      selection = { ...selection, index: Number(el.dataset.i) };
      paintAll();
      broadcast();
    });
  });
  const item = currentItem(selection);
  $('#partInfo').textContent = `${selection.items.length} parties`;
  $('#refbar').textContent = selection.label;
  $('#counter').textContent = `${cur + 1} / ${selection.items.length} · ${positionLabel(selection)}`;
  const active = box.querySelector('.part.cur');
  active?.scrollIntoView({ block: 'nearest' });
  paintPreview(item);
}

// ---------------------------------------------------------------------------
// Aperçu WYSIWYG : la scène de la sortie, rendue par le moteur partagé
// ---------------------------------------------------------------------------
const sceneCache = new Map();

function scaleStage() {
  const stage = $('#stage');
  const screen = $('#screen');
  if (!stage || !screen) return;
  const scale = screen.clientWidth / 1920;
  stage.style.transform = `scale(${scale})`;
}

window.addEventListener('resize', scaleStage);

async function sceneFor(kind) {
  if (sceneCache.has(kind)) return sceneCache.get(kind);
  const outputId = outputs.find((o) => targets.has(o.id))?.id || outputs[0]?.id || 'out_full';
  const output = outputs.find((o) => o.id === outputId);
  const sceneId = output?.scenesByKind?.[kind] || null;
  let scene = null;
  if (sceneId) {
    try {
      const res = await fetch(`/api/scenes/${encodeURIComponent(sceneId)}`, { cache: 'no-store' });
      if (res.ok) scene = await res.json();
    } catch { /* repli */ }
  }
  if (!scene) {
    scene = sceneFromPreset({
      id: `scn_preview_${kind}`,
      name: `Aperçu — ${kind}`,
      kind,
      preset: output?.preset || 'full',
      transparent: Boolean(output?.transparent)
    });
  }
  sceneCache.set(kind, scene);
  return scene;
}

async function paintPreview(item) {
  const screen = $('#screen');
  if (!item?.text) {
    screen.classList.add('idle');
    $('#stage').replaceChildren();
    $('#preview').textContent = 'Aucun contenu à l’antenne';
    return;
  }
  const scene = await sceneFor('bible');
  const content = contentFromPayload({
    text: item.text,
    reference: selection?.label,
    partIndex: item.partIndex,
    partCount: item.partCount,
    badge: selection?.bibleId === 'bible_sample_fr' ? 'LSG' : ''
  }, 'bible');
  mountScene($('#stage'), { scene, content, editing: false });
  screen.classList.remove('idle');
  scaleStage();
}

function paintOutputs() {
  const box = $('#outputs');
  box.innerHTML = outputs.map((o) => `
    <label class="out ${targets.has(o.id) ? 'on' : ''}" data-id="${o.id}">
      <input type="checkbox" ${targets.has(o.id) ? 'checked' : ''}>
      <span class="nm">${esc(o.name)}</span>
      <span class="ty">${o.width}×${o.height}</span>
    </label>
    <a class="btn sm" href="/o/${encodeURIComponent(o.id)}?kind=bible" target="_blank" rel="noopener"
       title="Ouvrir la sortie « ${esc(o.name)} » pour la Bible">↗ lien</a>`).join('');
  box.querySelectorAll('.out').forEach((el) => {
    el.querySelector('input').addEventListener('change', (e) => {
      const id = el.dataset.id;
      if (e.target.checked) targets.add(id); else targets.delete(id);
      el.classList.toggle('on', e.target.checked);
    });
  });
}

function paintAll() {
  paintField();
  paintSuggestions();
  paintParts();
}

function focusField() { $('#field').focus(); }

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
async function loadSelection(bookNum, chapter, first, last) {
  const params = new URLSearchParams({ book: String(bookNum), chapter: String(chapter) });
  if (first) params.set('first', String(first));
  if (last) params.set('last', String(last));
  for (const [k, v] of Object.entries(SETTINGS)) params.set(k, String(v));
  if (bibleId) params.set('bible', bibleId);

  const res = await fetch(`/api/bible/selection?${params}`, { cache: 'no-store' });
  const data = await res.json();
  if (!res.ok) {
    toast(data?.error?.message || 'Sélection impossible.', 'err');
    return;
  }
  if (data.empty) {
    toast(data.message, 'err');
    return;
  }
  selection = data;
  paintAll();
  // Sélectionner une référence ne diffuse pas : seules les sorties cochées
  // reçoivent, et seulement quand la diffusion est demandée (Entrée / bouton).
  broadcast();
}

async function broadcast(force = false) {
  const item = currentItem(selection);
  if (!item) return;
  if (!targets.size) {
    // Diffusion explicite sans case cochée : on retombe sur les sorties par défaut,
    // décidées par le serveur. Un simple aperçu, lui, n'envoie rien.
    if (!force) return;
    toast('Aucune sortie cochée : diffusion vers les sorties par défaut.');
  }
  const payload = {
    text: item.text,
    reference: selection.label,
    partIndex: item.partIndex,
    partCount: item.partCount,
    verse: item.verse,
    chapter: item.chapter,
    bookNum: item.bookNum,
    bibleId: selection.bibleId,
    sceneId: null
  };
  try {
    const res = await fetch('/api/live/show', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ targets: [...targets], kind: 'bible', payload })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || 'Diffusion refusée.');
    if (data.refused?.length) {
      const filtered = data.refused.filter((r) => r.reason === 'filtered').length;
      toast(filtered
        ? `${filtered} sortie(s) ne reçoivent pas la Bible.`
        : 'Diffusion partielle : vérifiez les sorties.', 'err');
    }
  } catch (err) {
    toast(err.message, 'err');
  }
}

async function clearOutputs() {
  await fetch('/api/live/clear', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ targets: [...targets] })
  });
  $('#stage').replaceChildren();
  $('#preview').textContent = 'Aucun contenu à l’antenne';
  $('#screen').classList.add('idle');
  toast('Sorties coupées.');
}

function move(action) {
  if (!selection) return;
  const result = navigate(selection, action);
  if (result.chapter) {
    const { delta } = result.chapter;
    const chapter = Math.max(1, Math.min(200, selection.chapter + delta));
    loadSelection(selection.bookNum, chapter);
    return;
  }
  if (!result.changed) return;
  selection = result.selection;
  paintParts();
  broadcast();
}

// ---------------------------------------------------------------------------
// Clavier (une seule source : le module partagé de navigation)
// ---------------------------------------------------------------------------
document.addEventListener('keydown', (event) => {
  if (isTypingTarget(event.target) && event.target.tagName !== 'DIV') return;
  const s = entry.state;

  if (event.key === 'Escape' && s.mode === STATE.BOOK && !s.query) {
    event.preventDefault();
    clearOutputs();
    return;
  }

  if (s.mode !== STATE.VERSE) {
    // Saisie texte / chiffres
    if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
      event.preventDefault();
      if (/^\d$/.test(event.key)) entry.typeDigits(event.key);
      else if (/^[a-zA-Z\u00c0-\u017f]$/.test(event.key)) entry.typeText(event.key);
      else if (event.key === ' ') entry.toVerseState();
      else if (/^[-–,.:]$/.test(event.key)) entry.toVerseState();
      paintAll();
      return;
    }
    if (event.key === 'Backspace') { event.preventDefault(); entry.backspace(); paintAll(); return; }
    if (event.key === 'Escape') { event.preventDefault(); entry.escape(); paintAll(); return; }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault(); entry.move(event.key === 'ArrowDown' ? 1 : -1); paintAll(); return;
    }
    if (event.key === 'Enter' || event.key === 'Tab') {
      event.preventDefault();
      const result = entry.enter();
      paintAll();
      if (result?.action) {
        loadSelection(result.action.bookNum, result.action.chapter, result.action.first, result.action.last);
        if (result.action.preview) return;
        entry.afterBroadcast();
        paintField();
      }
      return;
    }
    return;
  }

  // État verset : chiffres, tiret, Entrée
  if (/^\d$/.test(event.key)) { event.preventDefault(); entry.typeDigits(event.key); paintField(); return; }
  if (event.key === '-' || event.key === '–' || event.key === ',') {
    event.preventDefault(); entry.typeSeparator(event.key); paintField(); return;
  }
  if (event.key === 'Backspace') { event.preventDefault(); entry.backspace(); paintField(); return; }
  if (event.key === 'Escape') { event.preventDefault(); entry.escape(); paintField(); return; }
  if (event.key === 'Enter') {
    event.preventDefault();
    const preview = event.shiftKey;
    const result = entry.enter({ preview });
    paintField();
    if (result?.action) {
      loadSelection(result.action.bookNum, result.action.chapter, result.action.first, result.action.last)
        .then(() => { if (!preview) entry.afterBroadcast(); paintField(); });
    }
    return;
  }

  // Navigation dans la sélection (les touches du § 9.4.2)
  const action = actionForKey(event);
  if (!action) return;
  if (action === 'clear') { event.preventDefault(); clearOutputs(); return; }
  if (action === 'repeat') { event.preventDefault(); broadcast(true); return; }
  if (action.startsWith('verse:')) {
    event.preventDefault();
    const n = Number(action.split(':')[1]);
    const at = selection?.items.findIndex((it) => it.verse === n);
    if (at >= 0) { selection = { ...selection, index: at }; paintParts(); broadcast(); }
    return;
  }
  event.preventDefault();
  move(action);
});

// ---------------------------------------------------------------------------
// Démarrage
// ---------------------------------------------------------------------------
async function boot() {
  try {
    const [health, outs, versions] = await Promise.all([
      fetch('/api/health').then((r) => r.json()),
      fetch('/api/outputs').then((r) => r.json()),
      fetch('/api/bible/versions').then((r) => r.json())
    ]);
    $('#who').textContent = `${health.projectName || 'projet'} · port ${health.port} · ${health.lanToken ? 'réseau ' + health.lanToken : 'local'}`;
    bibleId = versions.versions?.[0]?.id || null;

    outputs = outs.outputs || [];
    sceneCache.clear();
    targets = new Set(outputs.filter((o) => o.targetByDefault !== false && o.receives?.bible !== false).map((o) => o.id));
    paintOutputs();
    paintAll();

    connectWs();
    focusField();
  } catch (err) {
    toast('Serveur injoignable — relancez OpenPresenter.', 'err');
  }
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(`${proto}://${location.host}/ws?channel=op_studio`);
  socket.addEventListener('open', () => {
    $('#ws').classList.add('on');
    $('#wsText').textContent = 'en ligne';
    socket.send(JSON.stringify({ t: 'hello' }));
  });
  socket.addEventListener('close', () => {
    $('#ws').classList.remove('on');
    $('#wsText').textContent = 'hors ligne';
    setTimeout(connectWs, 2000);
  });
  socket.addEventListener('message', (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    if (msg.t === 'hello:ack') $('#wsText').textContent = 'en ligne';
  });
}

$('#field').addEventListener('click', () => {
  if (entry.state.mode !== STATE.BOOK) { entry.escape(); paintAll(); }
  focusField();
});
$('#prev').onclick = () => move('prev');
$('#next').onclick = () => move('next');
$('#go').onclick = () => broadcast(true);
$('#clear').onclick = clearOutputs;

boot();
</script>
