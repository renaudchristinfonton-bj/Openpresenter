<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OpenPresenter — Sortie OBS</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent!important}body{position:relative;width:1920px;height:1080px}#stage{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}.res-scale #stage{width:1920px;height:1080px;top:50%;left:50%;inset:auto;position:absolute;transform:translate(-50%,-50%) scale(var(--sx,1),var(--sy,1));transform-origin:center center}.res-adapt #stage{width:100%;height:100%}.anim-in{animation:fadeIn .35s cubic-bezier(.16,1,.3,1) both}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.parts-hint{position:absolute;top:0;bottom:0;z-index:1000;display:flex;align-items:center;width:14%;color:#ffffff70;font:800 54px Inter,system-ui,sans-serif;opacity:0;transition:opacity .18s;pointer-events:none;text-shadow:0 2px 14px #000}.parts-hint-l{left:0;justify-content:flex-start;padding-left:4%}.parts-hint-r{right:0;justify-content:flex-end;padding-right:4%}.parts-active .parts-hint{opacity:.25}.parts-active:hover .parts-hint{opacity:.8}
</style>
</head><body class="res-scale">
<div id="stage"></div>
<div class="parts-hint parts-hint-l" id="hint-l" aria-hidden="true">‹</div>
<div class="parts-hint parts-hint-r" id="hint-r" aria-hidden="true">›</div>
<script src="../js/remote-channel.js"></script>
<script type="module">
import Engine from '../src/core/engine.mjs';
import { applyLockedPreset } from '../src/core/output.mjs';

const params = new URLSearchParams(location.search);
const sceneKey = params.get('scene') || 'main';
const lockMode = params.get('lockMode');
const stage = document.getElementById('stage');
const leftHint = document.getElementById('hint-l');
const rightHint = document.getElementById('hint-r');
const channel = new window.RemoteChannel(`op_channel_${sceneKey}`);
let current = null;
let ownedURLs = [];

function setResolution() {
  const value = params.get('res');
  if (!value) return;
  const [width, height] = value.toLowerCase().split('x').map(Number);
  if (!Number.isFinite(width) || !Number.isFinite(height) || width < 320 || height < 180 || width > 8192 || height > 8192) return;
  document.body.style.width = `${width}px`;
  document.body.style.height = `${height}px`;
  const fit = params.get('fit') || 'adapt';
  const sx = width / 1920;
  const sy = height / 1080;
  let x = sx; let y = sy;
  if (fit === 'stretch') { x = sx; y = sy; }
  else if (fit === 'fill') x = y = Math.max(sx, sy);
  else x = y = Math.min(sx, sy);
  document.body.style.setProperty('--sx', x);
  document.body.style.setProperty('--sy', y);
}
setResolution();

function makeBlobURLs(value) {
  if (typeof Blob !== 'undefined' && value instanceof Blob) {
    const url = URL.createObjectURL(value);
    ownedURLs.push(url);
    return url;
  }
  if (Array.isArray(value)) return value.map(makeBlobURLs);
  if (value && typeof value === 'object') {
    for (const key of Object.keys(value)) value[key] = makeBlobURLs(value[key]);
  }
  return value;
}
function cleanStage() {
  stage.replaceChildren();
  for (const url of ownedURLs) URL.revokeObjectURL(url);
  ownedURLs = [];
  document.body.classList.remove('parts-active');
  leftHint.style.display = 'none'; rightHint.style.display = 'none';
}

channel.onmessage = (event) => {
  const data = event.data || {};
  if (data.action === 'hide') { current = null; cleanStage(); return; }
  if (data.action !== 'show' || !data.scene) return;
  cleanStage();
  const scene = makeBlobURLs(applyLockedPreset(data.scene, lockMode));
  const bindings = makeBlobURLs(data.bindings || {});
  const root = Engine.render(scene, stage, bindings, { interactive: false, containerRect: () => ({ w: 1920, h: 1080 }) });
  if (root) root.classList.add('anim-in');
  const hasParts = !!(bindings.parts?.length > 1 && scene.splitMode === 'auto');
  if (hasParts) {
    document.body.classList.add('parts-active');
    leftHint.style.display = bindings.partIndex > 0 ? 'flex' : 'none';
    rightHint.style.display = bindings.partIndex < bindings.parts.length - 1 ? 'flex' : 'none';
  }
  current = { scene, bindings };
};

// OBS sources can open after the controller is already live. Ask for the current
// frame on startup; the controller responds on this isolated scene channel.
channel.postMessage({ action: 'ready', scene: sceneKey });

document.addEventListener('click', (event) => {
  if (!current?.bindings?.parts?.length) return;
  const side = event.clientX < window.innerWidth / 2 ? 'prev' : 'next';
  if (side === 'prev' && Number(current.bindings.partIndex || 0) <= 0) return;
  if (side === 'next' && Number(current.bindings.partIndex || 0) >= current.bindings.parts.length - 1) return;
  channel.postMessage({ action: 'clickPart', side, scene: sceneKey });
});
</script>
</body></html>
