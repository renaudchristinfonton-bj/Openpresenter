<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test Moteur</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
body{padding:40px;display:flex;flex-direction:column;gap:24px;align-items:center;background:#0b0b12;}
h1{color:#fff;font-size:20px;}
.stage{position:relative;width:min(960px,90vw);aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6);border:1px solid #222;}#stage-inner{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
select,button{background:var(--bg-2);color:#fff;border:1px solid var(--bg-3);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;}
button:hover{background:var(--bg-3);}
.info{color:#888;font-size:12px;max-width:700px;text-align:center;}
</style></head><body>
<h1>🧪 Test du moteur OpenPresenter 2</h1>
<div class="controls">
  <select id="preset">
    <option value="full">Plein écran</option>
    <option value="screen80">80% écran</option>
    <option value="bottom">Bandeau bas</option>
    <option value="bottom-right">Bandeau droite</option>
    <option value="lowerthird">Lower third</option>
  </select>
  <select id="kind">
    <option value="bible">Bible</option>
    <option value="songs">Paroles</option>
  </select>
  <button id="toggle-transparent">🔍 Transparent</button>
  <button id="split-test">📜 Split (verset long)</button>
</div>
<div class="stage checker-bg" id="stage"><div id="stage-inner"></div></div>
<p class="info">Clique les boutons pour changer de preset. Le damier simule un fond vidéo/caméra (transparence).</p>

<script type="module">
import Engine from './src/core/engine.mjs';
const stage=document.getElementById('stage');
const canvas=document.getElementById('stage-inner');
let currentKind='bible',currentPreset='full',transparent=false;
const longVerse='Car Dieu a tant aimé le monde qu\'il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu\'il ait la vie éternelle. En effet, Dieu n\'a pas envoyé son Fils dans le monde pour condamner le monde, mais afin que le monde soit sauvé par lui.';
function render(){
  const scene = Engine.defaultScene(currentPreset, currentKind);
  scene.transparent = transparent;
  const bindings = currentKind==='bible'
    ? { ref:'Jean 3:16-17', badge:'LSG', verse: longVerse,
        parts: scene.splitMode==='auto' ? Engine.splitSmart(longVerse, scene.splitChars) : null, partIndex:0 }
    : { title:'🎵 Quel ami fidèle', section:'Refrain',
        lyrics:'Quel ami fidèle et tendre,\nQue de se reposer sur Toi !\nDe tout souci se décharger,\nEt de tout remettre à Ta foi.' };
  canvas.style.transform=`scale(${stage.clientWidth/1920})`;
  canvas.replaceChildren();
  const root = Engine.render(scene, canvas, bindings, {
    interactive:false,
    containerRect:()=>({w:stage.clientWidth, h:stage.clientHeight})
  });
  if(root) root.classList.add('anim-in');
}
document.getElementById('preset').onchange = e => {currentPreset=e.target.value;render();};
document.getElementById('kind').onchange = e => {currentKind=e.target.value;render();};
document.getElementById('toggle-transparent').onclick = () => {transparent=!transparent;render();};
document.getElementById('split-test').onclick = () => {currentPreset='bottom';document.getElementById('preset').value='bottom';render();};
window.addEventListener('resize', render);
render();
</script>
</body></html>
