<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Régie Pasteur — Minuteur & Messages</title>
<script src="store.js"></script>
<script src="js/remote-channel.js"></script>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1120; color: #f8fafc; overflow: hidden; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .shell { display: flex; height: 100vh; }

    /* Colonne principale : le contrôleur de minuteur (timer-control-updated.html) */
    .left { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
    .bar {
        height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px;
        background: #111a2e; border-bottom: 1px solid #1e293b; font-size: 13px; font-weight: 800;
    }
    .bar .sub { font-size: 11px; color: #64748b; font-weight: 600; }
    .bar a { margin-left: auto; font-size: 11px; font-weight: 700; color: #93c5fd; text-decoration: none; background: #1e293b; border: 1px solid #334155; padding: 5px 10px; border-radius: 7px; }
    .left iframe { flex: 1; width: 100%; border: none; background: #0a0a0f; }

    /* Colonne droite : messages au pasteur */
    .right { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; background: #111a2e; }
    .right h2 { margin: 0; padding: 12px 14px; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: #94a3b8; border-bottom: 1px solid #1e293b; }
    .cur {
        margin: 12px; padding: 14px; border-radius: 10px; border: 1px solid #1e293b;
        min-height: 90px; display: flex; align-items: center; justify-content: center;
        text-align: center; font-size: 18px; font-weight: 800; line-height: 1.4; color: #e2e8f0;
    }
    .cur .ph { color: #334155; font-size: 13px; font-weight: 700; }
    .right.info .cur { background: rgba(59,130,246,.08); }
    .right.important .cur { background: rgba(251,191,36,.10); color: #fde68a; }
    .right.urgent .cur { background: rgba(239,68,68,.14); color: #fecaca; animation: p 1.1s infinite; }
    @keyframes p { 50% { background: rgba(239,68,68,.3); } }
    .meta { padding: 0 14px; font-size: 11px; color: #64748b; min-height: 18px; }
    .hist { flex: 1; min-height: 0; overflow: auto; margin: 10px 14px; border-top: 1px solid #1e293b; padding-top: 8px; }
    .hist .h-row { font-size: 11px; color: #64748b; padding: 4px 0; border-bottom: 1px dashed #1b2540; }
    .hist .h-row b { color: #94a3b8; }
    .composer { padding: 12px 14px 14px; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 8px; }
    textarea, select, input[type="text"] {
        background: #0d1526; border: 1px solid #334155; color: #f8fafc; border-radius: 8px;
        font-family: inherit; font-size: 13px; padding: 8px 10px; width: 100%;
    }
    textarea { resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row select, .row input { flex: 1; min-width: 0; }
    button {
        background: #1d4ed8; color: #fff; border: none; border-radius: 8px; font-weight: 800;
        font-size: 13px; padding: 9px 14px; cursor: pointer; font-family: inherit;
    }
    button:hover { background: #2563eb; }
    button.ghost { background: #1e293b; color: #cbd5e1; }
    button.amber { background: #b45309; }
</style>
</head>
<body>
<div class="shell">
    <div class="left">
        <div class="bar">
            ⏱️ Minuteur — file de décomptes
            <span class="sub">Espace : démarrer/pause · ←/→ : ±1 min</span>
            <a href="vue_pasteur.html" target="_blank">✝️ Ouvrir la Vue Pasteur</a>
        </div>
        <iframe src="timer-control-updated.html" title="Contrôle du minuteur"></iframe>
    </div>

    <div class="right info" id="panel">
        <h2>✉️ Message au pasteur</h2>
        <div class="cur" id="cur"><span class="ph">Aucun message envoyé</span></div>
        <div class="meta" id="meta"></div>
        <div class="hist" id="hist"></div>
        <div class="composer">
            <textarea id="m-text" rows="3" placeholder="Votre message… (Entrée pour envoyer)"></textarea>
            <div class="row">
                <select id="m-tone">
                    <option value="info">Info</option>
                    <option value="important">Important</option>
                    <option value="urgent">URGENT</option>
                </select>
                <input type="text" id="m-from" placeholder="De (ex : Régie)" value="Régie">
            </div>
            <div class="row">
                <button id="m-send">📤 Envoyer</button>
                <button id="m-clear" class="amber">Effacer l'écran</button>
                <button id="m-refresh" class="ghost" title="Recharger l'état depuis le dossier data/">⟳</button>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';
    // Même état/protocole que la Vue Pasteur (canal « pasteur_channel ») : les
    // messages envoyés ici apparaissent instantanément sur l'écran du pasteur,
    // et l'état survit aux rechargements (localStorage + dossier data/).

    var state = { timer: null, message: null, history: [] };
    var chan = null;
    try { chan = new RemoteChannel('pasteur_channel'); } catch (e) { chan = null; }

    function persist() {
        try {
            if (window.OpenStore) OpenStore.set('pasteur', 'state', state);
            else localStorage.setItem('pasteur:state', JSON.stringify(state));
        } catch (e) {}
    }
    function broadcast() { if (chan) { try { chan.postMessage({ type: 'state', state: state }); } catch (e) {} } persist(); }

    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function applyState(s) {
        if (!s) return;
        try {
            if (s.timer) state.timer = s.timer;
            state.message = s.message || null;
            state.history = Array.isArray(s.history) ? s.history : [];
            render();
        } catch (e) {}
    }

    function render() {
        var panel = document.getElementById('panel');
        var cur = document.getElementById('cur');
        var meta = document.getElementById('meta');
        var hist = document.getElementById('hist');
        panel.className = 'right ' + (state.message ? state.message.tone : 'info');
        if (state.message) {
            cur.innerText = state.message.text;
            var w = new Date(state.message.ts || Date.now());
            meta.innerText = (state.message.from ? 'De : ' + state.message.from + ' · ' : '') + pad2(w.getHours()) + ':' + pad2(w.getMinutes());
        } else {
            cur.innerHTML = '<span class="ph">Aucun message envoyé</span>';
            meta.innerText = '';
        }
        hist.innerHTML = (state.history || []).slice(0, 20).map(function (m) {
            var w = new Date(m.ts || Date.now());
            return '<div class="h-row"><b>' + (m.from || '—') + '</b> · ' + pad2(w.getHours()) + ':' + pad2(w.getMinutes()) + ' — ' + m.text + '</div>';
        }).join('');
    }

    if (chan) {
        chan.onmessage = function (ev) {
            try { if (ev.data && ev.data.type === 'state') applyState(ev.data.state); } catch (e) {}
        };
    }

    function restore() {
        return (async function () {
            var saved = null;
            try { saved = JSON.parse(localStorage.getItem('pasteur:state') || 'null'); } catch (e) {}
            if (!saved && window.OpenStore) {
                try { saved = await OpenStore.fetchFromServer('pasteur', 'state'); } catch (e) {}
            }
            if (saved) { state.timer = saved.timer || null; applyState(saved); }
        })();
    }
    setTimeout(restore, 0);

    function send() {
        var t = document.getElementById('m-text').value.trim();
        if (!t) return;
        if (state.message) { state.history.unshift(state.message); state.history = state.history.slice(0, 20); }
        state.message = { text: t, tone: document.getElementById('m-tone').value, from: document.getElementById('m-from').value.trim() || 'Régie', ts: Date.now() };
        document.getElementById('m-text').value = '';
        render(); broadcast();
    }
    function clearScreen() {
        if (state.message) { state.history.unshift(state.message); state.history = state.history.slice(0, 20); }
        state.message = null;
        render(); broadcast();
    }

    document.getElementById('m-send').addEventListener('click', send);
    document.getElementById('m-clear').addEventListener('click', clearScreen);
    document.getElementById('m-refresh').addEventListener('click', function () { restore().then(render); });
    document.getElementById('m-text').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
})();
</script>
</body>
</html>
