<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Unifié — Régie Live</title>
    <link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
    :root {
        --bible-accent: #f59e0b;
        --lyrics-accent: #8b5cf6;
        --media-accent: #2dd4bf;
        --lt-accent: #6366f1;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: 'Inter', sans-serif;
        background: #0f172a; color: #f8fafc;
        overflow: hidden;
    }
    .app-shell { display: flex; height: 100vh; width: 100vw; }

    /* ---------- Volet gauche ---------- */
    .sidebar {
        width: 84px; flex-shrink: 0;
        background: #0b1120;
        border-right: 1px solid #1e293b;
        display: flex; flex-direction: column;
        align-items: center;
        padding: 14px 0;
        gap: 6px;
    }
    .sidebar .logo {
        width: 40px; height: 40px; border-radius: 10px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; margin-bottom: 14px;
    }
    .nav-btn {
        width: 68px; padding: 10px 4px 8px;
        background: transparent; border: none; border-radius: 10px;
        color: #94a3b8; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        font-family: inherit; font-size: 10.5px; font-weight: 600;
        transition: background 0.15s ease, color 0.15s ease;
        border-left: 3px solid transparent;
    }
    .nav-btn .icon { font-size: 20px; line-height: 1; }
    .nav-btn:hover { background: #151f32; color: #e2e8f0; }
    .nav-btn.active { background: #172033; color: #fff; border-left-color: var(--tool-accent, #6366f1); }
    .nav-btn[data-tool="bible"] { --tool-accent: var(--bible-accent); }
    .nav-btn[data-tool="lyrics"] { --tool-accent: var(--lyrics-accent); }
    .nav-btn[data-tool="media"] { --tool-accent: var(--media-accent); }
    .nav-btn[data-tool="lt"] { --tool-accent: var(--lt-accent); }
    .nav-btn .status-dot {
        width: 6px; height: 6px; border-radius: 50%; background: #475569;
        margin-top: -2px;
    }
    .nav-btn.is-live .status-dot { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

    /* ---------- Colonne principale ---------- */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    /* ---------- Barre globale (toujours visible) ---------- */
    .topbar {
        height: 56px; flex-shrink: 0;
        background: #111a2e; border-bottom: 1px solid #1e293b;
        display: flex; align-items: center; gap: 10px;
        padding: 0 14px;
        overflow-x: auto;
    }
    .topbar .brand {
        font-weight: 800; font-size: 14px; color: #fff;
        white-space: nowrap; padding-right: 12px; border-right: 1px solid #1e293b;
        margin-right: 4px;
    }
    .tool-control {
        display: flex; align-items: center; gap: 6px;
        background: #0b1120; border: 1px solid #1e293b; border-radius: 8px;
        padding: 5px 8px 5px 10px; flex-shrink: 0;
    }
    .tool-control .t-label {
        font-size: 11px; font-weight: 700; color: #cbd5e1;
        display: flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .tool-control .t-dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; }
    .tool-control.is-live .t-dot { background: #ef4444; box-shadow: 0 0 5px #ef4444; }
    .btn-cut, .btn-launch {
        border: none; border-radius: 6px; font-family: inherit;
        font-size: 11px; font-weight: 700; padding: 5px 8px; cursor: pointer;
        transition: filter 0.15s ease;
    }
    .btn-cut { background: #7f1d1d; color: #fecaca; }
    .btn-cut:hover { filter: brightness(1.25); }
    .btn-launch { background: #14532d; color: #bbf7d0; }
    .btn-launch:hover { filter: brightness(1.25); }

    /* ---------- Zone des iframes ---------- */
    .frames { flex: 1; position: relative; min-height: 0; }
    .tool-frame {
        position: absolute; inset: 0;
        width: 100%; height: 100%; border: none;
        display: none;
        background: #0f172a;
    }
    .tool-frame.active { display: block; }

    /* ---------- Toast ---------- */
    #shell-toast {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: #1e293b; color: #f8fafc; border: 1px solid #334155;
        padding: 10px 16px; border-radius: 8px; font-size: 12.5px;
        opacity: 0; pointer-events: none; transition: all 0.25s ease;
        z-index: 9999; max-width: 420px; text-align: center;
    }
    #shell-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #shell-toast.error { border-color: #ef4444; color: #fecaca; }

    /* ---- Recherche unifiée (chants + versets + médias) ---- */
    .unified-search { position: relative; margin-left: 18px; flex: 1; max-width: 520px; }
    .unified-search input {
        width: 100%; padding: 8px 14px; border-radius: 9px; border: 1px solid #334155;
        background: #0d1526; color: #f8fafc; font-family: inherit; font-size: 13px; outline: none;
    }
    .unified-search input:focus { border-color: #6366f1; }
    .us-results {
        position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
        background: #0d1526; border: 1px solid #334155; border-radius: 10px;
        box-shadow: 0 18px 50px rgba(0,0,0,.55); max-height: 60vh; overflow-y: auto; display: none;
    }
    .us-results.open { display: block; }
    .us-group { padding: 6px 10px 2px; font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: #64748b; }
    .us-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; color: #e2e8f0; }
    .us-item:hover, .us-item.sel { background: rgba(99,102,241,.18); }
    .us-item .sub { color: #64748b; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .us-empty { padding: 12px; color: #475569; font-size: 12px; }
</style>
</head>
<body>

<div class="app-shell">
    <nav class="sidebar">
        <div class="logo">🎛️</div>
        <button class="nav-btn active" data-tool="bible" onclick="switchTab('bible')">
            <span class="icon">📖</span><span>Bible</span><span class="status-dot" id="dot-nav-bible"></span>
        </button>
        <button class="nav-btn" data-tool="lyrics" onclick="switchTab('lyrics')">
            <span class="icon">🎤</span><span>Paroles</span><span class="status-dot" id="dot-nav-lyrics"></span>
        </button>
        <button class="nav-btn" data-tool="media" onclick="switchTab('media')">
            <span class="icon">🖼️</span><span>Média</span><span class="status-dot" id="dot-nav-media"></span>
        </button>
        <button class="nav-btn" data-tool="lt" onclick="switchTab('lt')">
            <span class="icon">🏷️</span><span>Titre</span><span class="status-dot" id="dot-nav-lt"></span>
        </button>
    </nav>

    <div class="main">
        <div class="topbar">
            <div class="brand">Studio Unifié</div>

            <div class="unified-search">
                <input type="text" id="us-input" placeholder="🔍 Tout chercher : chant, verset, média… (Entrée = diffuser le 1ᵉʳ résultat)" autocomplete="off">
                <div class="us-results" id="us-results"></div>
            </div>

            <div class="tool-control" id="ctrl-bible">
                <span class="t-label"><span class="t-dot"></span>Bible</span>
                <button class="btn-launch" onclick="callToolFn('bible','launch')" title="Rejoue la dernière sélection affichée">▶ Relancer</button>
                <button class="btn-cut" onclick="callToolFn('bible','stop')">■ Couper</button>
            </div>
            <div class="tool-control" id="ctrl-lyrics">
                <span class="t-label"><span class="t-dot"></span>Paroles</span>
                <button class="btn-launch" onclick="callToolFn('lyrics','launch')" title="Rejoue la dernière sélection affichée">▶ Relancer</button>
                <button class="btn-cut" onclick="callToolFn('lyrics','stop')">■ Couper</button>
            </div>
            <div class="tool-control" id="ctrl-media">
                <span class="t-label"><span class="t-dot"></span>Média</span>
                <button class="btn-launch" onclick="callToolFn('media','launch')" title="Renvoie le dernier média affiché">▶ Relancer</button>
                <button class="btn-cut" onclick="callToolFn('media','stop')">■ Couper</button>
            </div>
            <div class="tool-control" id="ctrl-lt">
                <span class="t-label"><span class="t-dot"></span>Titre</span>
                <button class="btn-launch" onclick="callToolFn('lt','launch')" title="Rejoue le dernier lower third">▶ Relancer</button>
                <button class="btn-cut" onclick="callToolFn('lt','stop')">■ Couper</button>
            </div>
        </div>

        <div class="frames">
            <iframe id="frame-bible" class="tool-frame active" src="bible_control_display_pro.html"></iframe>
            <iframe id="frame-lyrics" class="tool-frame" src="lyrics_control_display_pro.html"></iframe>
            <iframe id="frame-media" class="tool-frame" src="media_control_display_pro.html"></iframe>
            <iframe id="frame-lt" class="tool-frame" src="obs_lower_third_ultimate_studio.html"></iframe>
        </div>
    </div>
</div>

<div id="shell-toast"></div>

<script>
    // Association outil -> iframe + noms des fonctions déjà existantes dans chaque outil
    // (celles utilisées par leurs propres boutons "Effacer OBS" / "Relancer" / "Lire").
    // On ne réinvente rien : on appelle directement ces fonctions sur la page chargée
    // dans l'iframe correspondant, qu'elle soit affichée à l'écran ou en arrière-plan.
    const TOOLS = {
        bible:  { frame: 'frame-bible',  stop: 'clearOBS', launch: 'relaunchLast' },
        lyrics: { frame: 'frame-lyrics', stop: 'clearOBS', launch: 'relaunchLast' },
        media:  { frame: 'frame-media',  stop: 'clearOBS', launch: 'relaunchLast' },
        lt:     { frame: 'frame-lt',     stop: 'cmdStop',  launch: 'relaunchLast' },
    };

    function switchTab(tool) {
        document.querySelectorAll('.tool-frame').forEach(f => f.classList.remove('active'));
        document.getElementById(TOOLS[tool].frame).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
    }

    function showShellToast(msg, isError) {
        const el = document.getElementById('shell-toast');
        el.textContent = msg;
        el.classList.toggle('error', !!isError);
        el.classList.add('show');
        clearTimeout(showShellToast._t);
        showShellToast._t = setTimeout(() => el.classList.remove('show'), 3200);
    }

    function callToolFn(tool, kind) {
        const def = TOOLS[tool];
        const frame = document.getElementById(def.frame);
        const fnName = def[kind];
        try {
            const win = frame.contentWindow;
            if (win && typeof win[fnName] === 'function') {
                win[fnName]();
            } else {
                showShellToast(`"${tool}" n'a pas encore fini de charger — réessayez dans un instant.`, true);
            }
        } catch (e) {
            // Cas typique : la page a été ouverte en double-clic (file://) au lieu de
            // passer par le serveur relais (http://localhost:8787/...). Dans ce cas,
            // le navigateur bloque l'accès entre fichiers pour des raisons de sécurité.
            showShellToast(`Impossible de contacter "${tool}". Ouvrez ce Studio via le lien du serveur relais (http://localhost:8787/...), pas en double-cliquant le fichier.`, true);
        }
    }

    // ============================================================
    // RECHERCHE UNIFIÉE — chants + versets + médias dans un seul champ
    // ============================================================
    (function () {
        const input = document.getElementById('us-input');
        const box = document.getElementById('us-results');
        if (!input || !box) return;
        const win = (id) => { try { return document.getElementById(id).contentWindow; } catch (e) { return null; } };
        const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        let debounce = null, items = [], sel = 0;

        function search(q) {
            const out = [];
            // Chants
            try {
                const wl = win('frame-lyrics');
                const songs = wl && wl.OpenPresenterLyrics ? wl.OpenPresenterLyrics.listSongs() : [];
                const nq = norm(q);
                songs.filter(x => norm(x.title + ' ' + (x.artist || '')).includes(nq)).slice(0, 6).forEach(x => {
                    out.push({ tool: 'lyrics', icon: '🎤', main: x.title, sub: (x.sections || []).length + ' section(s)' + (x.artist ? ' · ' + x.artist : ''), run: () => { switchTab('lyrics'); const w = win('frame-lyrics'); if (x.sections[0]) w.triggerDisplay(x.id, [x.sections[0].id]); } });
                });
            } catch (e) { /* outil pas prêt */ }
            // Médias
            try {
                const wm = win('frame-media');
                const its = wm && wm.OpenPresenterMedia ? wm.OpenPresenterMedia.listItems() : [];
                const nq = norm(q);
                its.filter(x => norm(x.name).includes(nq)).slice(0, 6).forEach(x => {
                    out.push({ tool: 'media', icon: '🖼️', main: x.name, sub: x.type, run: () => { switchTab('media'); win('frame-media').activateItem(x.id); } });
                });
            } catch (e) { /* outil pas prêt */ }
            // Bible (nom de livre + plein texte)
            try {
                const wb = win('frame-bible');
                const vs = wb && wb.OpenPresenterBible ? wb.OpenPresenterBible.search(q, 6) : [];
                vs.forEach(v => {
                    out.push({ tool: 'bible', icon: '📖', main: v.label, sub: v.excerpt || 'Aller au livre', run: () => { switchTab('bible'); win('frame-bible').triggerDisplay(v.bookName, v.chapterNum, [v.verseNum]); } });
                });
            } catch (e) { /* outil pas prêt */ }
            return out;
        }

        function render() {
            if (!items.length) { box.innerHTML = '<div class="us-empty">Aucun résultat (les outils finissent peut-être de charger…)</div>'; box.classList.add('open'); return; }
            let html = '', lastTool = null;
            const labels = { lyrics: 'Chants', media: 'Médias', bible: 'Bible' };
            items.forEach((it, i) => {
                if (it.tool !== lastTool) { html += `<div class="us-group">${it.icon} ${labels[it.tool]}</div>`; lastTool = it.tool; }
                html += `<div class="us-item${i === sel ? ' sel' : ''}" data-i="${i}">${it.icon} <span>${it.main}</span>${it.sub ? `<span class="sub">— ${it.sub}</span>` : ''}</div>`;
            });
            box.innerHTML = html;
            box.classList.add('open');
        }

        function refresh() {
            const q = input.value.trim();
            sel = 0;
            if (q.length < 2) { box.classList.remove('open'); items = []; return; }
            items = search(q);
            render();
        }

        input.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(refresh, 180); });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { box.classList.remove('open'); input.blur(); return; }
            if (!items.length) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); render(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); render(); }
            else if (e.key === 'Enter') { e.preventDefault(); items[sel].run(); box.classList.remove('open'); }
        });
        box.addEventListener('mousedown', (e) => {
            const el = e.target.closest('.us-item');
            if (!el) return;
            e.preventDefault();
            items[+el.dataset.i].run();
            box.classList.remove('open');
        });
        document.addEventListener('click', (e) => { if (!e.target.closest('.unified-search')) box.classList.remove('open'); });
    })();
</script>

    <script src="js/pwa.js"></script>
</body>
</html>
